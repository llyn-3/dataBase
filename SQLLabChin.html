<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL 實習室 — 互動練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-base:#f0f3f9;--bg-surface:#ffffff;--bg-sidebar:#f7f8fd;--bg-editor:#1a1f35;
  --bg-card:#ffffff;--bg-input:#edf0f8;--bg-hover:rgba(0,0,0,.04);
  --accent:#c0392b;--accent-glow:rgba(192,57,43,.13);--teal:#0a7c6e;--teal-glow:rgba(10,124,110,.11);
  --lavender:#6c5fc7;--lavender-glow:rgba(108,95,199,.1);
  --text-1:#1a1f36;--text-2:#505870;--text-3:#8b92a8;
  --success:#1a9e6a;--error:#c0392b;--warning:#c0392b;
  --border:#dde1ee;--border-focus:#b8bdd6;
  --shadow:0 2px 12px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.1);
  --radius:10px;--radius-sm:6px;--radius-lg:16px;
  --font-heading:'Noto Serif TC',serif;
  --font-body:'Noto Sans TC',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --sidebar-w:280px;--rsidebar-w:300px;
}
.dark{
  --bg-base:#0b1222;--bg-surface:#111a2e;--bg-sidebar:#0e1628;--bg-editor:#0d1424;
  --bg-card:#162036;--bg-input:#1a2544;--bg-hover:rgba(255,255,255,.04);
  --text-1:#e8edf5;--text-2:#8892a8;--text-3:#5a6480;
  --border:#1e2d4a;--border-focus:#2a3d62;
  --shadow:0 2px 12px rgba(0,0,0,.3);--shadow-lg:0 8px 32px rgba(0,0,0,.4);
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg-base);color:var(--text-1);line-height:1.6;overflow:hidden;height:100vh}
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:700;line-height:1.2}
code,pre,.cm-s-sql-lab{font-family:var(--font-mono)!important}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform .3s ease;z-index:100}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-header h1{font-size:1.3rem;display:flex;align-items:center;gap:10px}
.sidebar-header h1 .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--teal));border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.85rem;font-weight:800;flex-shrink:0}
.sidebar-header p{font-size:.72rem;color:var(--text-3);margin-top:4px;font-family:var(--font-mono)}
.sidebar-scroll{flex:1;overflow-y:auto;padding:12px 0}
.sidebar-section{padding:0 12px;margin-bottom:8px}
.sidebar-section-title{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-3);padding:8px 8px 4px;font-family:var(--font-mono)}
.schema-tables{padding:0 4px}
.schema-table{margin-bottom:2px}
.schema-table-name{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:.78rem;font-weight:500;color:var(--text-2);transition:all .15s}
.schema-table-name:hover{background:var(--bg-hover);color:var(--text-1)}
.schema-table-name i{font-size:.65rem;color:var(--teal);width:14px;text-align:center}
.schema-table-name .arrow{margin-left:auto;font-size:.6rem;transition:transform .2s}
.schema-table-name.open .arrow{transform:rotate(90deg)}
.schema-cols{padding:2px 0 2px 30px;display:none;font-size:.72rem;color:var(--text-3);font-family:var(--font-mono)}
.schema-cols.show{display:block}
.schema-col{padding:2px 0;display:flex;gap:6px}
.schema-col .col-name{color:var(--text-2)}
.schema-col .col-type{color:var(--lavender);font-size:.65rem}
.schema-col .col-pk{color:var(--accent);font-size:.6rem;font-weight:600}
.topic-list{padding:0 4px}
.topic-category{margin-bottom:2px}
.topic-cat-btn{display:flex;align-items:center;gap:8px;padding:6px 8px;width:100%;border:none;background:none;border-radius:var(--radius-sm);cursor:pointer;font-size:.8rem;font-weight:600;color:var(--text-2);font-family:var(--font-body);transition:all .15s;text-align:left}
.topic-cat-btn:hover{background:var(--bg-hover);color:var(--text-1)}
.topic-cat-btn i{width:18px;text-align:center;font-size:.75rem}
.topic-cat-btn .cat-arrow{margin-left:auto;font-size:.55rem;transition:transform .2s}
.topic-cat-btn.open .cat-arrow{transform:rotate(90deg)}
.topic-cat-btn .cat-count{margin-left:auto;margin-right:4px;font-size:.6rem;background:var(--bg-input);padding:1px 6px;border-radius:10px;color:var(--text-3);font-family:var(--font-mono)}
.topic-items{display:none;padding:2px 0 2px 12px}
.topic-items.show{display:block}
.topic-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:.78rem;color:var(--text-2);transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:var(--font-body)}
.topic-item:hover{background:var(--bg-hover);color:var(--text-1)}
.topic-item.active{background:var(--accent-glow);color:var(--accent);font-weight:600}
.topic-item .check{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.5rem;flex-shrink:0;transition:all .2s}
.topic-item.completed .check{background:var(--success);border-color:var(--success);color:#fff}
.progress-bar{margin:12px 16px;padding:12px;background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border)}
.progress-bar .prog-label{display:flex;justify-content:space-between;font-size:.7rem;color:var(--text-3);margin-bottom:6px;font-family:var(--font-mono)}
.prog-track{height:6px;background:var(--bg-input);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));border-radius:3px;transition:width .4s ease;width:0}

.rsidebar{width:var(--rsidebar-w);min-width:var(--rsidebar-w);background:var(--bg-sidebar);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform .3s ease, margin .3s ease, min-width .3s ease, width .3s ease;z-index:100}
.rsidebar.collapsed{width:0;min-width:0;border-left:none;overflow:hidden}
.rsidebar-header{padding:16px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.rsidebar-header h3{font-size:.95rem;display:flex;align-items:center;gap:8px}
.rsidebar-header h3 i{color:var(--teal);font-size:.8rem}
.rsidebar-close{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:.9rem;padding:4px;border-radius:var(--radius-sm)}
.rsidebar-close:hover{color:var(--text-1);background:var(--bg-hover)}
.rsidebar-scroll{flex:1;overflow-y:auto;padding:8px 0}
.rsidebar-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 12px;flex-shrink:0}
.rsidebar-tab{flex:1;padding:8px 4px;font-size:.72rem;font-weight:600;text-align:center;border:none;background:none;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;font-family:var(--font-body);transition:all .15s}
.rsidebar-tab:hover{color:var(--text-2)}
.rsidebar-tab.active{color:var(--teal);border-bottom-color:var(--teal)}
.rsidebar-panel{display:none;padding:8px 12px}
.rsidebar-panel.active{display:block}
.snippet-group{margin-bottom:6px}
.snippet-group-btn{display:flex;align-items:center;gap:6px;padding:5px 8px;width:100%;border:none;background:none;border-radius:var(--radius-sm);cursor:pointer;font-size:.75rem;font-weight:600;color:var(--text-2);font-family:var(--font-body);transition:all .15s;text-align:left}
.snippet-group-btn:hover{background:var(--bg-hover);color:var(--text-1)}
.snippet-group-btn i{font-size:.6rem;color:var(--teal);width:14px}
.snippet-group-btn .sg-arrow{margin-left:auto;font-size:.5rem;transition:transform .2s}
.snippet-group-btn.open .sg-arrow{transform:rotate(90deg)}
.snippet-items{display:none;padding:2px 0 2px 8px}
.snippet-items.show{display:block}
.snippet-card{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:4px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.snippet-card:hover{border-left-color:var(--teal);background:var(--bg-hover);transform:translateX(2px)}
.snippet-card .sn-title{font-size:.74rem;font-weight:600;color:var(--text-1);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.snippet-card .sn-title i{color:var(--teal);font-size:.55rem}
.snippet-card .sn-sql{font-size:.66rem;color:var(--text-3);font-family:var(--font-mono);white-space:pre-wrap;line-height:1.4;max-height:48px;overflow:hidden}
.saved-empty{padding:20px;text-align:center;color:var(--text-3);font-size:.8rem}
.saved-empty i{display:block;font-size:1.5rem;margin-bottom:8px;opacity:.3}
.saved-card{display:flex;align-items:center;gap:6px;padding:8px 10px;margin-bottom:4px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.saved-card:hover{border-left-color:var(--accent);background:var(--bg-hover)}
.saved-card .sv-info{flex:1;min-width:0}
.saved-card .sv-name{font-size:.74rem;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-card .sv-preview{font-size:.64rem;color:var(--text-3);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-card .sv-del{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:.7rem;padding:4px;border-radius:var(--radius-sm);flex-shrink:0}
.saved-card .sv-del:hover{color:var(--error);background:rgba(192,57,43,.1)}
.saved-actions{padding:8px 0;display:flex;gap:6px;flex-wrap:wrap}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.main-header{display:flex;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg-surface);flex-shrink:0;gap:8px}
.menu-btn{display:none;background:none;border:none;font-size:1.2rem;color:var(--text-2);cursor:pointer;padding:4px;border-radius:var(--radius-sm)}
.main-header .breadcrumb{font-size:.78rem;color:var(--text-3);font-family:var(--font-mono)}
.main-header .breadcrumb span{color:var(--accent);font-weight:600}
.db-actions{margin-left:auto;display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:.78rem;font-weight:600;border:1px solid var(--border);background:var(--bg-surface);color:var(--text-2);cursor:pointer;font-family:var(--font-body);transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--border-focus);color:var(--text-1)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{filter:brightness(1.1);border-color:var(--accent)}
.btn-teal{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-teal:hover{filter:brightness(1.1);border-color:var(--teal)}
.btn-sm{padding:5px 10px;font-size:.72rem}
.btn i{font-size:.7rem}

.main-scroll{flex:1;overflow-y:auto;padding:0}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;min-height:100%;text-align:center}
.welcome-icon{font-size:3rem;margin-bottom:20px;background:linear-gradient(135deg,var(--accent),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome h2{font-size:1.8rem;margin-bottom:8px}
.welcome p{color:var(--text-2);max-width:500px;margin-bottom:24px;font-size:.92rem}
.welcome-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;width:100%;max-width:600px}
.welcome-card{padding:16px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);text-align:center;transition:all .2s;cursor:pointer}
.welcome-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.welcome-card i{font-size:1.3rem;margin-bottom:8px;display:block}
.welcome-card .wc-title{font-size:.82rem;font-weight:600;margin-bottom:2px}
.welcome-card .wc-count{font-size:.68rem;color:var(--text-3);font-family:var(--font-mono)}
.wc-ddl i{color:#c0392b}.wc-dml i{color:#0a7c6e}.wc-select i{color:#6c5fc7}.wc-ops i{color:#c0392b}
.wc-func i{color:#3b82f6}.wc-join i{color:#ec4899}.wc-sub i{color:#f59e0b}.wc-view i{color:#10b981}
.wc-ref i{color:var(--teal)}

.topic-view{display:none;padding:24px;max-width:960px}
.topic-view.active{display:block}
.topic-title-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.topic-title-row h2{font-size:1.5rem}
.cat-badge{font-size:.65rem;font-weight:600;padding:3px 10px;border-radius:20px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.5px}
.cat-ddl{background:var(--accent-glow);color:var(--accent)}
.cat-dml{background:var(--teal-glow);color:var(--teal)}
.cat-select{background:var(--lavender-glow);color:var(--lavender)}
.cat-operators{background:rgba(192,57,43,.1);color:var(--error)}
.cat-functions{background:rgba(59,130,246,.1);color:#3b82f6}
.cat-joins{background:rgba(236,72,153,.1);color:#ec4899}
.cat-subqueries{background:rgba(245,158,11,.1);color:#f59e0b}
.cat-views{background:rgba(16,185,129,.1);color:#10b981}
.theory-block{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;font-size:.88rem;line-height:1.7}
.theory-block h3{font-size:1rem;margin-bottom:10px;color:var(--accent)}
.theory-block p{color:var(--text-2);margin-bottom:10px}
.theory-block ul{padding-left:20px;color:var(--text-2);margin-bottom:10px}
.theory-block li{margin-bottom:4px}
.syntax-box{background:var(--bg-editor);color:#c9d1d9;padding:14px 16px;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:.8rem;margin:10px 0;overflow-x:auto;line-height:1.5;border:1px solid rgba(255,255,255,.06)}
.syntax-box .kw{color:#ff7b72}.syntax-box .fn{color:#d2a8ff}
.syntax-box .str{color:#a5d6ff}.syntax-box .cm{color:#8b949e}

.editor-section{margin-bottom:20px}
.editor-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.editor-toolbar .label{font-size:.78rem;font-weight:600;color:var(--text-2)}
.editor-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--bg-editor)}
.CodeMirror{height:160px;font-size:.85rem;line-height:1.5;font-family:var(--font-mono)!important}
.cm-s-sql-lab .CodeMirror-gutters{background:#151b30;border-right:1px solid #1e2844}
.cm-s-sql-lab .CodeMirror-linenumber{color:#4a5480}
.cm-s-sql-lab{background:#1a2040!important;color:#c9d1d9!important}
.dark .cm-s-sql-lab{background:#0d1424!important}
.cm-s-sql-lab .cm-keyword{color:#ff9e64;font-weight:600}
.cm-s-sql-lab .cm-number{color:#89ddff}
.cm-s-sql-lab .cm-string{color:#c3e88d}
.cm-s-sql-lab .cm-string-2{color:#c3e88d}
.cm-s-sql-lab .cm-comment{color:#546178;font-style:italic}
.cm-s-sql-lab .cm-operator{color:#89ddff}
.cm-s-sql-lab .cm-builtin{color:#c792ea}
.cm-s-sql-lab .cm-atom{color:#f78c6c}
.cm-s-sql-lab .cm-def{color:#82aaff}
.cm-s-sql-lab .cm-variable{color:#c9d1d9}
.cm-s-sql-lab .cm-variable-2{color:#eeffff}
.cm-s-sql-lab .cm-type{color:#ffcb6b}
.cm-s-sql-lab .cm-bracket{color:#89ddff}
.cm-s-sql-lab .CodeMirror-cursor{border-left:2px solid var(--accent)!important}
.cm-s-sql-lab .CodeMirror-selected{background:rgba(108,95,199,.2)!important}
.cm-s-sql-lab .CodeMirror-activeline-background{background:rgba(255,255,255,.03)!important}
.CodeMirror-focused .cm-matchhighlight{background:rgba(255,255,255,.08)}

.results-section{margin-bottom:20px}
.results-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.results-header .label{font-size:.78rem;font-weight:600;color:var(--text-2)}
.results-meta{font-size:.68rem;color:var(--text-3);font-family:var(--font-mono);margin-left:auto}
.results-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.results-table-wrap{overflow-x:auto;max-height:280px;overflow-y:auto}
.results-table{width:100%;border-collapse:collapse;font-size:.8rem}
.results-table th{background:var(--bg-input);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-2);white-space:nowrap}
.results-table td{padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text-2);font-family:var(--font-mono);font-size:.78rem}
.results-table tr:hover td{background:var(--bg-hover)}
.results-table tr:last-child td{border-bottom:none}
.result-msg{padding:16px;font-size:.85rem;color:var(--text-2);text-align:center}
.result-msg.msg-error{color:var(--error);background:rgba(192,57,43,.06)}
.result-msg.msg-success{color:var(--success);background:rgba(26,158,106,.06)}
.result-msg i{margin-right:6px}
.result-empty{padding:24px;text-align:center;color:var(--text-3);font-size:.82rem}
.result-empty i{display:block;font-size:1.5rem;margin-bottom:8px;opacity:.4}

.challenge-section{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.challenge-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.challenge-header i{color:var(--warning);font-size:1rem}
.challenge-header h3{font-size:1rem}
.challenge-header .ch-num{font-size:.68rem;color:var(--text-3);font-family:var(--font-mono);margin-left:auto}
.challenge-desc{font-size:.88rem;color:var(--text-2);margin-bottom:14px;line-height:1.6}
.challenge-desc code{background:var(--bg-input);padding:1px 6px;border-radius:3px;font-family:var(--font-mono);font-size:.8rem;color:var(--lavender)}
.hint-toggle{font-size:.78rem;color:var(--text-3);cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;transition:color .15s}
.hint-toggle:hover{color:var(--accent)}
.hint-toggle i{font-size:.6rem;transition:transform .2s}
.hint-toggle.open i{transform:rotate(90deg)}
.hint-content{display:none;font-size:.82rem;color:var(--text-3);padding:10px 14px;background:var(--bg-input);border-radius:var(--radius-sm);margin-bottom:12px;font-style:italic;border-left:3px solid var(--accent)}
.hint-content.show{display:block}
.challenge-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.challenge-result{font-size:.82rem;padding:8px 12px;border-radius:var(--radius-sm);margin-top:10px;display:none}
.challenge-result.pass{display:block;background:rgba(26,158,106,.1);color:var(--success);border:1px solid rgba(26,158,106,.2)}
.challenge-result.fail{display:block;background:rgba(192,57,43,.08);color:var(--error);border:1px solid rgba(192,57,43,.15)}
.challenge-result i{margin-right:6px}
.topic-nav{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.topic-nav .btn{font-size:.78rem}

.ref-view{display:none;padding:24px;max-width:960px}
.ref-view.active{display:block}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.ref-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:border-color .2s}
.ref-card:hover{border-color:var(--accent)}
.ref-card h4{font-size:.9rem;margin-bottom:10px;color:var(--accent);display:flex;align-items:center;gap:8px}
.ref-card h4 i{font-size:.75rem}
.ref-card .syntax-box{margin:0;font-size:.72rem;padding:10px 12px}

.save-inline{padding:8px 12px;display:none}
.save-inline.show{display:block}
.save-inline input{width:100%;padding:8px 10px;font-size:16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text-1);font-family:var(--font-body);margin-bottom:6px;outline:none}
.save-inline input:focus{border-color:var(--accent)}
.save-inline .save-btns{display:flex;gap:6px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-box{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;max-width:380px;width:90%;box-shadow:var(--shadow-lg);transform:scale(.95);transition:transform .2s}
.modal-overlay.open .modal-box{transform:scale(1)}
.modal-box h3{margin-bottom:8px;font-size:1.1rem}
.modal-box p{font-size:.88rem;color:var(--text-2);margin-bottom:20px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}

.loading-screen{position:fixed;inset:0;background:var(--bg-base);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .4s}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loader{width:48px;height:48px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen p{font-size:.88rem;color:var(--text-2);font-family:var(--font-mono)}
.loading-screen .load-sub{font-size:.72rem;color:var(--text-3);margin-top:4px}

.kb-hint{font-size:.65rem;color:var(--text-3);font-family:var(--font-mono);display:flex;align-items:center;gap:4px;margin-left:auto}
.kb-hint kbd{background:var(--bg-input);padding:1px 5px;border-radius:3px;border:1px solid var(--border);font-size:.6rem}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg-card);color:var(--text-1);border:1px solid var(--border);padding:10px 20px;border-radius:var(--radius);font-size:.82rem;font-weight:600;box-shadow:var(--shadow-lg);z-index:300;transition:transform .3s ease;display:flex;align-items:center;gap:8px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast i{color:var(--success)}

@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none}
  .sidebar-overlay.open{display:block}
  .rsidebar{position:fixed;right:0;top:0;bottom:0;transform:translateX(100%);box-shadow:var(--shadow-lg);width:85vw;min-width:85vw;max-width:340px}
  .rsidebar.collapsed{transform:translateX(100%)}
  .rsidebar:not(.collapsed){transform:translateX(0)}
  .rsidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none}
  .rsidebar-overlay.show{display:block}
  .menu-btn{display:block}
  .topic-view{padding:16px}
  .ref-view{padding:16px}
  .welcome-grid{grid-template-columns:repeat(2,1fr)}
  .topic-title-row h2{font-size:1.2rem}
  .kb-hint{display:none}
  .db-actions .btn span.hide-mobile{display:none}
  .ref-grid{grid-template-columns:1fr}
}
@media(min-width:769px){.rsidebar-overlay{display:none!important}}
@media(max-width:480px){.welcome-grid{grid-template-columns:1fr 1fr}.welcome h2{font-size:1.3rem}}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.topic-view.active{animation:fadeIn .3s ease}
.ref-view.active{animation:fadeIn .3s ease}
.welcome-card{animation:fadeIn .4s ease backwards}
.welcome-card:nth-child(2){animation-delay:.05s}
.welcome-card:nth-child(3){animation-delay:.1s}
.welcome-card:nth-child(4){animation-delay:.15s}
.welcome-card:nth-child(5){animation-delay:.2s}
.welcome-card:nth-child(6){animation-delay:.25s}
.welcome-card:nth-child(7){animation-delay:.3s}
.welcome-card:nth-child(8){animation-delay:.35s}
.welcome-card:nth-child(9){animation-delay:.4s}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loader"></div>
  <p>正在初始化 SQL 引擎</p>
  <p class="load-sub">載入 WebAssembly...</p>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">重置數據庫？</h3>
    <p id="modalMsg">此操作將把數據庫還原至原始狀態，所有更改將會遺失。</p>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-accent" id="modalConfirm">重置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastMsg"></span></div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="rsidebar-overlay" id="rsidebarOverlay"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><span class="logo-icon">S</span> SQL 實習室</h1>
      <p>互動練習環境</p>
    </div>
    <div class="sidebar-scroll">
      <div class="progress-bar">
        <div class="prog-label"><span>學習進度</span><span id="progText">0 / 0</span></div>
        <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title"><i class="fa-solid fa-database"></i> 數據庫結構</div>
        <div class="schema-tables" id="schemaPanel"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title"><i class="fa-solid fa-book"></i> 課題</div>
        <div class="topic-list" id="topicList"></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="main-header">
      <button class="menu-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
      <div class="breadcrumb" id="breadcrumb">SQL 實習室 <span>/ 主頁</span></div>
      <div class="db-actions">
        <button class="btn btn-sm" onclick="showRefView()" title="SQL 快速參考"><i class="fa-solid fa-book-open"></i> <span class="hide-mobile">參考資料</span></button>
        <button class="btn btn-sm" onclick="resetDbPrompt()"><i class="fa-solid fa-rotate-right"></i> <span class="hide-mobile">重置資料庫</span></button>
        <button class="btn btn-sm" id="rsidebarToggle" onclick="toggleRSidebar()" title="程式片段及已儲存查詢"><i class="fa-solid fa-code"></i> <span class="hide-mobile">程式片段</span></button>
        <button class="btn" id="themeToggleBtn" onclick="toggleTheme()">
          <i class="fas fa-moon"></i> <span class="hide-mobile">主題</span>
        </button>
        <label class="btn" style="cursor:pointer;" title="匯入 .sqlite 檔案">
          <i class="fas fa-upload"></i> <span class="hide-mobile">匯入</span>
          <input type="file" id="importDbInput" accept=".sqlite,.db,.sqlite3" style="display:none;" onchange="importDatabase(event)">
        </label>
        <button class="btn btn-teal" onclick="exportDatabase()" title="下載為 .sqlite">
          <i class="fas fa-download"></i> <span class="hide-mobile">匯出資料庫</span>
        </button>
      </div>
    </header>

    <div class="main-scroll" id="mainScroll">
      <div class="welcome" id="welcomeView">
        <div class="welcome-icon"><i class="fa-solid fa-terminal"></i></div>
        <h2>歡迎使用 SQL 實習室</h2>
        <p>透過實際操作掌握結構化查詢語言（SQL）。選擇以下任一課題，立即在瀏覽器中撰寫真實的查詢語句。</p>
        <div class="welcome-grid" id="welcomeGrid"></div>
      </div>
      <div class="topic-view" id="topicView"></div>
      <div class="ref-view" id="refView"></div>
    </div>
  </main>

  <aside class="rsidebar collapsed" id="rsidebar">
    <div class="rsidebar-header">
      <h3><i class="fa-solid fa-code"></i> 快速面板</h3>
      <button class="rsidebar-close" onclick="toggleRSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="rsidebar-tabs">
      <button class="rsidebar-tab active" data-panel="snippetsPanel" onclick="switchRTab(this)"><i class="fa-solid fa-bolt"></i> 程式片段</button>
      <button class="rsidebar-tab" data-panel="savedPanel" onclick="switchRTab(this)"><i class="fa-solid fa-bookmark"></i> 已儲存</button>
    </div>
    <div class="rsidebar-scroll">
      <div class="rsidebar-panel active" id="snippetsPanel"></div>
      <div class="rsidebar-panel" id="savedPanel"></div>
    </div>
  </aside>
</div>

<script>
/* ========== 深色模式 ========== */
if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.classList.add('dark')}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{if(e.matches)document.documentElement.classList.add('dark');else document.documentElement.classList.remove('dark')});

/* ========== 類別及課題 ========== */
var CATEGORIES=[
  {id:'ddl',name:'資料定義語言（DDL）',icon:'fa-hammer',color:'accent'},
  {id:'dml',name:'資料操控語言（DML）',icon:'fa-pen-to-square',color:'teal'},
  {id:'select',name:'SELECT 查詢',icon:'fa-magnifying-glass',color:'lavender'},
  {id:'operators',name:'運算符',icon:'fa-not-equal',color:'error'},
  {id:'functions',name:'內置函數',icon:'fa-square-root-variable',color:'#3b82f6'},
  {id:'joins',name:'連接查詢',icon:'fa-circle-nodes',color:'#ec4899'},
  {id:'subqueries',name:'子查詢',icon:'fa-layer-group',color:'#f59e0b'},
  {id:'views',name:'檢視表（VIEW）',icon:'fa-eye',color:'#10b981'}
];

var TOPICS = [
  {id:'create-table',cat:'ddl',title:'CREATE TABLE（建立資料表）',
    theory:'<h3>建立資料表</h3><p><code>CREATE TABLE</code> 語句用於定義一個新的資料表，包括欄位、資料類型及約束條件。</p><div class="syntax-box"><span class="kw">CREATE TABLE</span> 資料表名稱 (<br>&nbsp;&nbsp;欄位1 資料類型 <span class="cm">約束條件</span>,<br>&nbsp;&nbsp;欄位2 資料類型 <span class="cm">約束條件</span>,<br>&nbsp;&nbsp;...<br>);</div><p><strong>常用資料類型：</strong> INTEGER（整數）、REAL（實數）、TEXT（文字）、BLOB（二進位資料）</p><p><strong>約束條件：</strong> PRIMARY KEY（主關鍵碼）、NOT NULL（非空）、UNIQUE（唯一）、DEFAULT（預設值）、FOREIGN KEY（外鍵碼）</p>',
    example:'CREATE TABLE students (\n  student_id INTEGER PRIMARY KEY,\n  name TEXT NOT NULL,\n  email TEXT UNIQUE,\n  gpa REAL DEFAULT 0.0,\n  enrolled_date TEXT\n);\n\nSELECT * FROM students;',
    challenges:[
      {title:'建立 projects 資料表',desc:'建立一個名為 <code>projects</code> 的資料表，包含：<code>project_id</code>（INTEGER，PRIMARY KEY）、<code>title</code>（TEXT，NOT NULL）、<code>budget</code>（REAL）及 <code>start_date</code>（TEXT）。',hint:'使用 CREATE TABLE projects (...) 並指定正確的資料類型及約束條件。',validate:function(db){try{var t=db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name='projects'");if(!t.length||!t[0].values.length)return{pass:false,msg:'找不到資料表 "projects"。'};var cols=db.exec("PRAGMA table_info(projects)");var names=cols[0].values.map(function(r){return r[1]});if(!names.includes('project_id'))return{pass:false,msg:'缺少欄位 "project_id"。'};if(!names.includes('title'))return{pass:false,msg:'缺少欄位 "title"。'};if(!names.includes('budget'))return{pass:false,msg:'缺少欄位 "budget"。'};if(!names.includes('start_date'))return{pass:false,msg:'缺少欄位 "start_date"。'};return{pass:true,msg:'成功建立 projects 資料表！'}}catch(e){return{pass:false,msg:e.message}}}},
      {title:'建立 suppliers 資料表',desc:'建立一個名為 <code>suppliers</code> 的資料表，包含：<code>supplier_id</code>（INTEGER，PRIMARY KEY）、<code>name</code>（TEXT，NOT NULL）及 <code>contact_email</code>（TEXT）。',hint:'CREATE TABLE suppliers (supplier_id INTEGER PRIMARY KEY, name TEXT NOT NULL, contact_email TEXT);',validate:function(db){try{var t=db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name='suppliers'");if(!t.length)return{pass:false,msg:'找不到資料表 "suppliers"。'};return{pass:true,msg:'成功建立 suppliers 資料表！'}}catch(e){return{pass:false,msg:e.message}}}}
    ]
  },
  {id:'alter-table',cat:'ddl',title:'ALTER TABLE（修改資料表結構）',
    theory:'<h3>修改資料表結構</h3><p><code>ALTER TABLE</code> 用於修改現有資料表的結構。在 SQLite 中，可以新增欄位及重新命名資料表。</p><div class="syntax-box"><span class="kw">ALTER TABLE</span> 資料表名稱 <span class="kw">ADD COLUMN</span> 欄位名稱 資料類型;<br><span class="kw">ALTER TABLE</span> 資料表名稱 <span class="kw">RENAME TO</span> 新名稱;<br><span class="kw">ALTER TABLE</span> 資料表名稱 <span class="kw">RENAME COLUMN</span> 舊名稱 <span class="kw">TO</span> 新名稱;</div><p><strong>注意：</strong> SQLite 對 ALTER TABLE 的支援較其他數據庫管理系統有所限制。</p>',
    example:'-- 在 employees 資料表新增 phone 欄位\nALTER TABLE employees ADD COLUMN phone TEXT;\n\n-- 確認更改\nPRAGMA table_info(employees);',
    challenges:[
      {title:'在 products 資料表新增欄位',desc:'在 <code>products</code> 資料表中新增一個名為 <code>discount</code> 的 <code>REAL</code> 類型欄位。',hint:'ALTER TABLE products ADD COLUMN discount REAL;',validate:function(db){try{var cols=db.exec("PRAGMA table_info(products)");var names=cols[0].values.map(function(r){return r[1]});if(names.includes('discount'))return{pass:true,msg:'成功在 products 資料表新增 "discount" 欄位！'};return{pass:false,msg:'找不到 "discount" 欄位。'}}catch(e){return{pass:false,msg:e.message}}}},
      {title:'在 orders 資料表新增狀態',desc:'在 <code>orders</code> 資料表中新增一個名為 <code>status</code> 的 <code>TEXT</code> 類型欄位，用來記錄訂單狀態。',hint:'ALTER TABLE orders ADD COLUMN status TEXT;',validate:function(db){try{var cols=db.exec("PRAGMA table_info(orders)");var names=cols[0].values.map(function(r){return r[1]});if(names.includes('status'))return{pass:true,msg:'成功在 orders 新增 status 欄位！'};return{pass:false,msg:'找不到 status 欄位。'}}catch(e){return{pass:false,msg:e.message}}}}
    ]
  },
  {id:'drop-table',cat:'ddl',title:'DROP TABLE（刪除資料表）',
    theory:'<h3>刪除資料表</h3><p><code>DROP TABLE</code> 會永久刪除資料表及其所有數據。</p><div class="syntax-box"><span class="kw">DROP TABLE</span> 資料表名稱;<br><span class="kw">DROP TABLE IF EXISTS</span> 資料表名稱;</div><p><strong>注意：</strong> 此操作無法復原。建議使用 <code>IF EXISTS</code> 以避免錯誤。</p>',
    example:'-- 建立臨時資料表，然後刪除\nCREATE TABLE temp_data (id INTEGER, value TEXT);\nINSERT INTO temp_data VALUES (1, \'test\');\nSELECT * FROM temp_data;',
    challenges:[
      {title:'刪除臨時資料表',desc:'先執行上方範例建立 <code>temp_data</code>，然後使用 <code>IF EXISTS</code> 將其刪除。',hint:'DROP TABLE IF EXISTS temp_data;',validate:function(db){try{var t=db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name='temp_data'");if(!t.length||!t[0].values.length)return{pass:true,msg:'成功刪除資料表 "temp_data"！'};return{pass:false,msg:'資料表 "temp_data" 仍然存在。'}}catch(e){return{pass:false,msg:e.message}}}},
      {title:'刪除供應商資料表',desc:'請使用 <code>IF EXISTS</code> 刪除 <code>products</code> 資料表。',hint:'DROP TABLE IF EXISTS products;',validate:function(db){try{var t=db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name='products'");if(!t.length)return{pass:true,msg:'成功刪除資料表！請按重置資料庫回復初始設定！！！！！'};return{pass:false,msg:'資料表仍然存在。'}}catch(e){return{pass:false,msg:e.message}}}}
    ]
  },
  {id:'insert',cat:'dml',title:'INSERT INTO（插入數據）',
    theory:'<h3>插入數據</h3><p><code>INSERT INTO</code> 用於在資料表中增加新的記錄（列）。</p><div class="syntax-box"><span class="kw">INSERT INTO</span> 資料表 (欄位1, 欄位2) <span class="kw">VALUES</span> (值1, 值2);</div>',
    example:'INSERT INTO departments (dept_id, dept_name, location)\nVALUES (99, \'Research\', \'Seattle\');\n\nSELECT * FROM departments;',
    challenges:[
      {title:'新增員工記錄',desc:'插入一位新員工，資料如下：<code>emp_id</code> = 99、<code>first_name</code> = \'Grace\'、<code>last_name</code> = \'Lee\'、<code>email</code> = \'grace@company.com\'、<code>salary</code> = 72000、<code>hire_date</code> = \'2024-03-15\'、<code>dept_id</code> = 1。',hint:'INSERT INTO employees (emp_id, first_name, ...) VALUES (99, \'Grace\', ...);',validate:function(db){try{var r=db.exec("SELECT * FROM employees WHERE emp_id=99");if(r.length > 0)return{pass:true,msg:'Grace 已成功加入！'};return{pass:false,msg:'找不到 emp_id=99 的員工。'}}catch(e){return{pass:false,msg:e.message}}}},
      {title:'新增熱門產品',desc:'新增一筆產品到 <code>products</code>：<code>product_id</code> = 101, <code>product_name</code> = \'Wireless Charger\', <code>category</code> = \'Electronics\', <code>price</code> = 39.99, <code>stock</code> = 250。',hint:'INSERT INTO products VALUES (101, \'Wireless Charger\', \'Electronics\', 39.99, 250);',validate:function(db){try{var r=db.exec("SELECT * FROM products WHERE product_id=101");if(r.length > 0)return{pass:true,msg:'成功新增產品！'};return{pass:false,msg:'找不到 product_id=101 的產品。'}}catch(e){return{pass:false,msg:e.message}}}}
    ]
  },
  {id:'update',cat:'dml',title:'UPDATE（修改數據）',
    theory:'<h3>修改數據</h3><p><code>UPDATE</code> 用於修改資料表中現有記錄的內容。使用時必須加上 <code>WHERE</code> 子句！</p><div class="syntax-box"><span class="kw">UPDATE</span> 資料表名稱<br><span class="kw">SET</span> 欄位1 = 值1, 欄位2 = 值2<br><span class="kw">WHERE</span> 條件;</div>',
    example:'-- 為第 1 號員工加薪 10%\nUPDATE employees SET salary = salary * 1.10\nWHERE emp_id = 1;\n\nSELECT emp_id, first_name, salary FROM employees WHERE emp_id = 1;',
    challenges:[
      {title:'更新部門地點',desc:'將 Marketing 部門（dept_id = 2）的 <code>location</code> 改為 \'Boston\'。',hint:'UPDATE departments SET location = \'Boston\' WHERE dept_id = 2;',validate:function(db){try{var r=db.exec("SELECT location FROM departments WHERE dept_id=2");if(r.length&&r[0].values[0][0]==='Boston')return{pass:true,msg:'Marketing 部門地點已成功更新！'};return{pass:false,msg:'location 尚未更改為 "Boston"。'}}catch(e){return{pass:false,msg:e.message}}}},
      {title:'修正測試資料庫存',desc:'請將 <code>products</code> 資料表中 <code>product_id = 9</code>  的 <code>stock</code> 更新為 100。',hint:'UPDATE products SET stock = 100 WHERE product_id = 9;',validate:function(db){try{var r=db.exec("SELECT stock FROM products WHERE product_id=1");if(r.length && r[0].values[0][0] === 100)return{pass:true,msg:'庫存更新成功！'};return{pass:false,msg:'庫存尚未更新為 100。'}}catch(e){return{pass:false,msg:e.message}}}}
    ]
  },
  {id:'delete',cat:'dml',title:'DELETE（刪除數據）',
    theory:'<h3>刪除數據</h3><p><code>DELETE FROM</code> 用於刪除資料表中指定的記錄。必須使用 <code>WHERE</code> 子句。</p><div class="syntax-box"><span class="kw">DELETE FROM</span> 資料表名稱 <span class="kw">WHERE</span> 條件;</div>',
    example:'-- 刪除特定產品\nDELETE FROM products WHERE product_id = 99;\n\nSELECT * FROM products WHERE product_id = 99;',
    challenges:[

  {id:'string-functions',cat:'functions',title:'字串函數',

  {id:'inner-join',cat:'joins',title:'INNER JOIN（等連接）',

  {id:'union-operations',cat:'joins',title:'UNION & UNION ALL（集合操作）',
    theory:'<h3>UNION & UNION ALL（集合操作）</h3><p><code>UNION</code> 用於合併兩個或多個 <code>SELECT</code> 語句的結果集。每個 <code>SELECT</code> 語句必須擁有相同數量的欄位，且對應的欄位必須擁有相似的資料類型。</p><ul><li><code>UNION</code> — 合併結果並<strong>自動去除重複</strong>的記錄。</li><li><code>UNION ALL</code> — 合併結果並<strong>保留所有</strong>記錄（包含重複值），執行效率通常較高。</li></ul>',
    example:'-- 合併員工部門與客戶的所有城市（自動去重）\nSELECT city FROM employees\nUNION\nSELECT city FROM customers;',
    challenges:[
      {
        title:'UNION：所有夥伴的國家',
        desc:'請結合 <code>departments</code> 與 <code>customers</code> 資料表，查詢出所有不重複的國家 <code>country</code> 名單。',
        hint:'SELECT location AS city FROM departments UNION SELECT city FROM customers;',
        validate:function(db,res){
          if(!res) return {pass:false, msg:'請先執行查詢。'};
          var q = editor.getValue().toUpperCase();
          if(q.includes('UNION') && !q.includes('UNION ALL')) {
            try {
              var exp = db.exec("SELECT location AS city FROM departments UNION SELECT city FROM customers");
              if(res.values.length === exp[0].values.length) {
                return {pass:true, msg:'UNION 運用成功，已成功取得不重複的國家名單！'};
              }
            } catch(e) {
              return {pass:false, msg:'查詢執行錯誤：' + e.message};
            }
          }
          return {pass:false, msg:'請確保使用了 UNION 關鍵字來去除重複值。'};
        }
      },
      {
        title:'UNION ALL：完整城市清單',
        desc:'請結合 <code>departments</code> 與 <code>customers</code> 資料表，列出所有的城市 <code>city</code>，**包含重複出現的城市**。',
        hint:'SELECT location AS city FROM departments UNION ALL SELECT city FROM customers;',
        validate:function(db,res){
          if(!res) return {pass:false, msg:'請先執行查詢。'};
          var q = editor.getValue().toUpperCase();
          if(q.includes('UNION ALL')) {
            try {
              var exp = db.exec("SELECT location AS city FROM departments UNION ALL SELECT city FROM customers");
              if(res.values.length === exp[0].values.length) {
                return {pass:true, msg:'UNION ALL 運用成功，已完整列出包含重複值的城市清單！'};
              }
            } catch(e) {
              return {pass:false, msg:'查詢執行錯誤：' + e.message};
            }
          }
          return {pass:false, msg:'請使用 UNION ALL 運算符以保留重複的記錄。'};
        }
      }
    ]
  },

/* ========== 應用程式狀態 ========== */
var db=null,editor=null,lastResult=null,currentTopic=null,currentChallenge=0;
var SQL=null;
var completedTopics=new Set();
var savedQueries=[];
var toastTimer=null;
var modalCallback=null;

/* ========== 匯出數據庫 ========== */
function exportDatabase(){
  if(!db){alert('數據庫尚未初始化！');return}
  const binaryArray=db.export();
  const blob=new Blob([binaryArray],{type:'application/x-sqlite3'});
  const url=window.URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='sqllab_export.sqlite';
  document.body.appendChild(a);a.click();document.body.removeChild(a);window.URL.revokeObjectURL(url);
}

/* ========== 匯入數據庫 ========== */
async function getSqlEngine(){
  if(SQL!==null)return SQL;
  const config={locateFile:file=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`};
  SQL=await initSqlJs(config);
  return SQL;
}

async function importDatabase(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async function(){
    try{
      const uInt8Array=new Uint8Array(this.result);
      const engine=await getSqlEngine();
      const header=String.fromCharCode.apply(null,uInt8Array.slice(0,16));
      if(!header.startsWith("SQLite format 3")){
        throw new Error("無效的 SQLite 檔案格式。請選擇有效的 .sqlite 數據庫檔案。");
      }
      const tempDb=new engine.Database(uInt8Array);
      const res=tempDb.exec("SELECT name, sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'");
      if(res.length>0){
        const tables=res[0].values;
        let mergedCount=0,errorCount=0;
        tables.forEach(table=>{
          const tableName=table[0],createSql=table[1];
          try{
            db.run(createSql.replace(/CREATE TABLE/i,'CREATE TABLE IF NOT EXISTS'));
            const dataRes=tempDb.exec(`SELECT * FROM "${tableName}"`);
            if(dataRes.length>0){
              const columns=dataRes[0].columns,values=dataRes[0].values;
              const placeholders=columns.map(()=>'?').join(',');
              const insertSql=`INSERT OR IGNORE INTO "${tableName}" (${columns.map(c=>`"${c}"`).join(',')}) VALUES (${placeholders})`;
              values.forEach(row=>{db.run(insertSql,row)});
            }
            mergedCount++;
          }catch(e){console.warn(`合併資料表 ${tableName} 失敗：`,e);errorCount++}
        });
        refreshSchema();
        showModal("合併完成",`成功合併 ${mergedCount} 個資料表。${errorCount>0?errorCount+' 個資料表因錯誤而略過。':''}`,"關閉",closeModal);
      }else{
        showModal("匯入","匯入的檔案中未找到任何資料表。","關閉",closeModal);
      }
      tempDb.close();
    }catch(err){
      console.error("合併錯誤：",err);
      showModal("匯入錯誤",(err.message||"合併過程中發生未知錯誤。"),"確定",closeModal);
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value="";
}

/* ========== 重置數據庫 ========== */
function resetDatabase(){
  if(!db)return;
  try{
    var objects=db.exec("SELECT type, name FROM sqlite_master WHERE type IN ('table','view') AND name NOT LIKE 'sqlite_%'");
    if(objects.length){objects[0].values.forEach(function(r){try{db.run('DROP '+r[0].toUpperCase()+' IF EXISTS "'+r[1]+'"')}catch(e){}})}
    db.run(INIT_SQL);
    refreshSchema();
    showModal("數據庫已重置","數據庫已還原至原始狀態。","關閉",closeModal);
  }catch(e){console.error("重置錯誤：",e)}
}

/* ========== 深色/淺色主題 ========== */
function toggleTheme(){
  const body=document.body;body.classList.toggle('dark');
  const isDark=body.classList.contains('dark');
  localStorage.setItem('sqllab-theme',isDark?'dark':'light');
  updateThemeIcon(isDark);
  if(typeof editor!=='undefined'&&editor){setTimeout(()=>editor.refresh(),10)}
}
function updateThemeIcon(isDark){const icon=document.querySelector('#themeToggleBtn i');if(icon)icon.className=isDark?'fas fa-sun':'fas fa-moon'}
function initTheme(){
  const savedTheme=localStorage.getItem('sqllab-theme');
  const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(savedTheme==='dark'||(!savedTheme&&prefersDark)){document.body.classList.add('dark');updateThemeIcon(true)}
  else{document.body.classList.remove('dark');updateThemeIcon(false)}
}
window.addEventListener('DOMContentLoaded',initTheme);

/* ========== 執行查詢 ========== */
function runQuery(){
  if(!editor)return;
  var sql=editor.getValue().trim();
  if(!sql){showResultMsg('請輸入 SQL 查詢語句。','error');return}
  var start=performance.now();
  try{
    var statements=sql.split(';').filter(function(s){return s.trim()});
    var finalResult=null;
    statements.forEach(function(stmt){var s=stmt.trim();if(!s)return;var results=db.exec(s);if(results.length)finalResult=results[results.length-1]});
    var elapsed=(performance.now()-start).toFixed(1);
    if(finalResult){lastResult=finalResult;renderTable(finalResult,elapsed)}
    else{lastResult=null;var upper=sql.toUpperCase();if(upper.includes('INSERT')||upper.includes('UPDATE')||upper.includes('DELETE')||upper.includes('CREATE')||upper.includes('ALTER')||upper.includes('DROP')){showResultMsg('語句執行成功。（'+elapsed+'ms）','success');refreshSchema()}else{showResultMsg('查詢未返回任何結果。（'+elapsed+'ms）','info')}}
  }catch(e){lastResult=null;showResultMsg(e.message,'error')}
}

function renderTable(result,elapsed){
  var wrap=document.getElementById('resultsContent');
  var meta=document.getElementById('resultsMeta');
  if(meta)meta.textContent=result.values.length+' 列 \u00b7 '+elapsed+'ms';
  var html='<div class="results-table-wrap"><table class="results-table"><thead><tr>';
  result.columns.forEach(function(c){html+='<th>'+escHtml(c)+'</th>'});
  html+='</tr></thead><tbody>';
  result.values.forEach(function(row){html+='<tr>';row.forEach(function(val){var display=val===null?'<em style="color:var(--text-3)">NULL</em>':escHtml(String(val));html+='<td>'+display+'</td>'});html+='</tr>'});
  html+='</tbody></table></div>';
  if(wrap)wrap.innerHTML=html;
}

function showResultMsg(msg,type){
  var wrap=document.getElementById('resultsContent');var meta=document.getElementById('resultsMeta');
  if(!wrap)return;if(meta)meta.textContent='';
  var cls=type==='error'?'msg-error':type==='success'?'msg-success':'';
  var icon=type==='error'?'fa-circle-exclamation':type==='success'?'fa-circle-check':'fa-info-circle';
  wrap.innerHTML='<div class="result-msg '+cls+'"><i class="fa-solid '+icon+'"></i> '+escHtml(msg)+'</div>';
}

/* ========== 資料庫結構 ========== */
function refreshSchema(){
  var panel=document.getElementById('schemaPanel');
  try{
    var tables=db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
    if(!tables.length){panel.innerHTML='<div style="padding:8px;font-size:.75rem;color:var(--text-3)">沒有資料表</div>';return}
    var html='';
    tables[0].values.forEach(function(r){var tname=r[0];var cols=db.exec('PRAGMA table_info("'+tname+'")');html+='<div class="schema-table"><div class="schema-table-name" onclick="toggleSchemaTable(this)"><i class="fa-solid fa-table"></i> '+escHtml(tname)+' <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span></div><div class="schema-cols">';if(cols.length){cols[0].values.forEach(function(row){var pk=row[5]?'<span class="col-pk">PK</span>':'';html+='<div class="schema-col">'+pk+'<span class="col-name">'+escHtml(row[1])+'</span> <span class="col-type">'+escHtml(row[2]||'ANY')+'</span></div>'})}html+='</div></div>'});
    panel.innerHTML=html;
  }catch(e){panel.innerHTML=''}
}
function toggleSchemaTable(el){el.classList.toggle('open');el.nextElementSibling.classList.toggle('show')}

function selectTopic(topicId){

  var cat=CATEGORIES.find(function(c){return c.id===topic.cat});
  document.getElementById('breadcrumb').innerHTML='SQL 實習室 <span>/ '+(cat?cat.name:'')+' / '+escHtml(topic.title)+'</span>';
  var view=document.getElementById('topicView');var html='';
  html+='<div class="topic-title-row"><h2>'+escHtml(topic.title)+'</h2><span class="cat-badge cat-'+topic.cat+'">'+(cat?cat.name:'')+'</span></div>';
  html+='<div class="theory-block">'+topic.theory+'</div>';

  html+='<button class="btn btn-sm" onclick="loadExample()"><i class="fa-solid fa-clipboard"></i> 載入範例</button>';
  html+='<button class="btn btn-sm" onclick="saveQueryPrompt()"><i class="fa-solid fa-bookmark"></i> 儲存</button>';
  html+='<button class="btn btn-sm btn-accent" onclick="runQuery()"><i class="fa-solid fa-play"></i> 執行</button>';
  html+='<span class="kb-hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 執行</span></div>';
  html+='<div class="editor-wrap"><textarea id="sqlEditor"></textarea></div></div>';
  html+='<div class="results-section"><div class="results-header"><span class="label"><i class="fa-solid fa-table-list"></i> 查詢結果</span><span class="results-meta" id="resultsMeta"></span></div><div class="results-wrap" id="resultsContent"><div class="result-empty"><i class="fa-solid fa-database"></i>執行查詢語句以查看結果</div></div></div>';
  if(topic.challenges&&topic.challenges.length){topic.challenges.forEach(function(ch,i){html+='<div class="challenge-section" id="challenge-'+i+'"><div class="challenge-header"><i class="fa-solid fa-trophy"></i><h3>'+escHtml(ch.title)+'</h3><span class="ch-num">練習題 '+(i+1)+'/'+topic.challenges.length+'</span></div><div class="challenge-desc">'+ch.desc+'</div><div class="hint-toggle" onclick="toggleHint(this)"><i class="fa-solid fa-chevron-right"></i> 顯示提示</div><div class="hint-content">'+escHtml(ch.hint)+'</div><div class="challenge-actions"><button class="btn btn-teal" onclick="checkChallenge('+i+')"><i class="fa-solid fa-check-double"></i> 核對答案</button></div><div class="challenge-result" id="challengeResult-'+i+'"></div></div>'})}
  var idx=TOPICS.indexOf(topic);html+='<div class="topic-nav">';
  if(idx>0)html+='<button class="btn" onclick="selectTopic(\''+TOPICS[idx-1].id+'\')"><i class="fa-solid fa-arrow-left"></i> '+escHtml(TOPICS[idx-1].title)+'</button>';else html+='<span></span>';
  if(idx<TOPICS.length-1)html+='<button class="btn" onclick="selectTopic(\''+TOPICS[idx+1].id+'\')">'+escHtml(TOPICS[idx+1].title)+' <i class="fa-solid fa-arrow-right"></i></button>';
  html+='</div>';
  view.innerHTML=html;
  document.getElementById('welcomeView').style.display='none';
  document.getElementById('refView').className='ref-view';
  view.className='topic-view active';
  var ta=document.getElementById('sqlEditor');
  if(editor){try{editor.toTextArea()}catch(e){}}
  editor=CodeMirror.fromTextArea(ta,{mode:'text/x-sql',theme:'sql-lab',lineNumbers:true,lineWrapping:true,indentWithTabs:false,indentUnit:2,tabSize:2,matchBrackets:true,autofocus:false,styleActiveLine:true,extraKeys:{'Ctrl-Enter':runQuery,'Cmd-Enter':runQuery}});
  editor.setValue('-- 請在此撰寫您的查詢語句\n');editor.focus();
  document.getElementById('mainScroll').scrollTop=0;closeSidebar();
}

function loadExample(){if(!currentTopic||!editor)return;editor.setValue(currentTopic.example);editor.focus()}
function toggleHint(el){el.classList.toggle('open');el.textContent='';var icon=document.createElement('i');icon.className='fa-solid fa-chevron-right';el.appendChild(icon);el.appendChild(document.createTextNode(el.classList.contains('open')?' 隱藏提示':' 顯示提示'));el.nextElementSibling.classList.toggle('show')}

function checkChallenge(index){
  if(!currentTopic||!currentTopic.challenges[index])return;
  var ch=currentTopic.challenges[index];var result=ch.validate(db,lastResult);
  var el=document.getElementById('challengeResult-'+index);
  if(result.pass){el.className='challenge-result pass';el.innerHTML='<i class="fa-solid fa-circle-check"></i> '+escHtml(result.msg);completedTopics.add(currentTopic.id+'-'+index);updateProgress();updateSidebarCompletion()}
  else{el.className='challenge-result fail';el.innerHTML='<i class="fa-solid fa-circle-xmark"></i> '+escHtml(result.msg)}
}

/* ========== 參考資料檢視 ========== */
function showRefView(){
  document.getElementById('welcomeView').style.display='none';
  document.getElementById('topicView').className='topic-view';
  var view=document.getElementById('refView');
  document.getElementById('breadcrumb').innerHTML='SQL 實習室 <span>/ 參考資料</span>';
  var html='<div class="topic-title-row"><h2>SQL 快速參考</h2><span class="cat-badge cat-dml">速查表</span></div>';
  html+='<div class="ref-grid">';
  REF_CARDS.forEach(function(card){html+='<div class="ref-card"><h4><i class="fa-solid '+card.icon+'"></i> '+card.title+'</h4><div class="syntax-box">'+card.syntax+'</div></div>'});
  html+='</div>';
  view.innerHTML=html;view.className='ref-view active';
  document.getElementById('mainScroll').scrollTop=0;closeSidebar();
  document.querySelectorAll('.topic-item').forEach(function(el){el.classList.remove('active')});
}

/* ========== 進度 ========== */
function getTotalChallenges(){return TOPICS.reduce(function(sum,t){return sum+(t.challenges?t.challenges.length:0)},0)}
function updateProgress(){var total=getTotalChallenges();var done=completedTopics.size;document.getElementById('progText').textContent=done+' / '+total;document.getElementById('progFill').style.width=(total?(done/total*100):0)+'%'}
function updateSidebarCompletion(){TOPICS.forEach(function(topic){if(!topic.challenges)return;var allDone=topic.challenges.every(function(_,i){return completedTopics.has(topic.id+'-'+i)});var el=document.querySelector('.topic-item[data-id="'+topic.id+'"]');if(el){if(allDone)el.classList.add('completed');else el.classList.remove('completed')}})}

/* ========== 右側欄 — 程式片段 ========== */
function buildSnippetsPanel(){
  var panel=document.getElementById('snippetsPanel');var html='';
  SNIPPETS.forEach(function(group,gi){
    html+='<div class="snippet-group"><button class="snippet-group-btn" onclick="toggleSnippetGroup(this)"><i class="fa-solid '+group.icon+'"></i> '+group.category+' <span class="sg-arrow"><i class="fa-solid fa-chevron-right"></i></span></button><div class="snippet-items">';
    group.items.forEach(function(item,ii){html+='<div class="snippet-card" onclick="loadSnippet('+gi+','+ii+')"><div class="sn-title"><i class="fa-solid fa-arrow-right-to-bracket"></i> '+escHtml(item.title)+'</div><div class="sn-sql">'+escHtml(item.sql)+'</div></div>'});
    html+='</div></div>';
  });
  panel.innerHTML=html;
}
function toggleSnippetGroup(btn){btn.classList.toggle('open');btn.nextElementSibling.classList.toggle('show')}
function loadSnippet(gi,ii){
  var snippet=SNIPPETS[gi].items[ii];
  if(!editor){showToast('請先開啟一個課題以使用編輯器');return}
  editor.setValue(snippet.sql);editor.focus();showToast('已載入片段：'+snippet.title);
}

/* ========== 右側欄 — 已儲存查詢 ========== */
function buildSavedPanel(){
  var panel=document.getElementById('savedPanel');
  if(!savedQueries.length){panel.innerHTML='<div class="saved-empty"><i class="fa-solid fa-bookmark"></i>尚未儲存任何查詢。<br>請在編輯器中使用「儲存」按鈕。</div>';return}
  var html='<div class="saved-actions"><button class="btn btn-sm btn-teal" onclick="downloadSavedQueries()"><i class="fa-solid fa-download"></i> 下載全部</button></div>';
  savedQueries.forEach(function(q,i){html+='<div class="saved-card" onclick="loadSavedQuery('+i+')"><div class="sv-info"><div class="sv-name">'+escHtml(q.name)+'</div><div class="sv-preview">'+escHtml(q.sql.substring(0,60))+'</div></div><button class="sv-del" onclick="event.stopPropagation();deleteSavedQuery('+i+')" title="刪除"><i class="fa-solid fa-trash-can"></i></button></div>'});
  panel.innerHTML=html;
}

function saveQueryPrompt(){
  if(!editor){showToast('沒有活躍的編輯器');return}
  var sql=editor.getValue().trim();
  if(!sql||sql==='-- 請在此撰寫您的查詢語句'){showToast('請先撰寫查詢語句');return}
  var rs=document.getElementById('rsidebar');
  if(rs.classList.contains('collapsed'))toggleRSidebar();
  switchRTabByName('savedPanel');
  var panel=document.getElementById('savedPanel');
  var existing=panel.querySelector('.save-inline');
  if(existing){existing.classList.add('show');existing.querySelector('input').focus();return}
  var div=document.createElement('div');div.className='save-inline show';
  div.innerHTML='<input type="text" placeholder="查詢名稱..." id="saveNameInput" maxlength="50"><div class="save-btns"><button class="btn btn-sm btn-teal" onclick="confirmSaveQuery()"><i class="fa-solid fa-check"></i> 儲存</button><button class="btn btn-sm" onclick="cancelSaveQuery()">取消</button></div>';
  panel.insertBefore(div,panel.firstChild);
  var inp=div.querySelector('input');inp.focus();
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')confirmSaveQuery();if(e.key==='Escape')cancelSaveQuery()});
}

function confirmSaveQuery(){
  var inp=document.getElementById('saveNameInput');var name=inp?inp.value.trim():'';
  if(!name){inp.style.borderColor='var(--error)';return}
  var sql=editor.getValue().trim();
  savedQueries.push({name:name,sql:sql,time:Date.now()});
  cancelSaveQuery();buildSavedPanel();showToast('查詢已儲存：'+name);
}
function cancelSaveQuery(){var el=document.querySelector('.save-inline');if(el)el.remove()}
function loadSavedQuery(index){if(!editor){showToast('請先開啟一個課題');return}editor.setValue(savedQueries[index].sql);editor.focus();showToast('已載入：'+savedQueries[index].name)}
function deleteSavedQuery(index){savedQueries.splice(index,1);buildSavedPanel();showToast('查詢已刪除')}
function downloadSavedQueries(){
  if(!savedQueries.length)return;
  var text=savedQueries.map(function(q){return'-- '+q.name+'\n'+q.sql+';'}).join('\n\n');
  var blob=new Blob([text],{type:'text/sql'});var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='saved_queries.sql';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

/* ========== 右側欄切換 ========== */
function toggleRSidebar(){var rs=document.getElementById('rsidebar');var ov=document.getElementById('rsidebarOverlay');rs.classList.toggle('collapsed');if(!rs.classList.contains('collapsed')){ov.classList.add('show')}else{ov.classList.remove('show')}}
function switchRTab(btn){document.querySelectorAll('.rsidebar-tab').forEach(function(t){t.classList.remove('active')});document.querySelectorAll('.rsidebar-panel').forEach(function(p){p.classList.remove('active')});btn.classList.add('active');document.getElementById(btn.dataset.panel).classList.add('active')}
function switchRTabByName(panelId){var btn=document.querySelector('.rsidebar-tab[data-panel="'+panelId+'"]');if(btn)switchRTab(btn)}

/* ========== 提示訊息 ========== */
function showToast(msg){var toast=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;toast.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.classList.remove('show')},2200)}

/* ========== 模態視窗 ========== */
function showModal(title,msg,confirmText,onConfirm){document.getElementById('modalTitle').textContent=title;document.getElementById('modalMsg').textContent=msg;var confirmBtn=document.getElementById('modalConfirm');confirmBtn.textContent=confirmText;modalCallback=onConfirm;confirmBtn.onclick=function(){closeModal();if(modalCallback)modalCallback()};document.getElementById('modalOverlay').classList.add('open')}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');modalCallback=null}
function resetDbPrompt(){showModal('重置數據庫？','此操作將把所有資料表還原至原始狀態，所有更改將會遺失。','重置',function(){resetDatabase()})}

/* ========== 側欄切換 ========== */
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarOverlay').classList.add('open')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open')}

/* ========== 事件綁定 ========== */
function bindEvents(){
  document.getElementById('menuBtn').addEventListener('click',openSidebar);
  document.getElementById('sidebarOverlay').addEventListener('click',closeSidebar);
  document.getElementById('rsidebarOverlay').addEventListener('click',function(){var rs=document.getElementById('rsidebar');if(!rs.classList.contains('collapsed'))toggleRSidebar()});
  document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal()});
}

/* ========== 工具函數 ========== */
function escHtml(str){var div=document.createElement('div');div.appendChild(document.createTextNode(str));return div.innerHTML}

/* ========== 初始化 ========== */
async function initApp(){
  try{
    const engine=await getSqlEngine();
    db=new engine.Database();
    db.run(INIT_SQL);
    buildSidebar();buildWelcome();refreshSchema();updateProgress();
    buildSnippetsPanel();buildSavedPanel();bindEvents();
    document.getElementById('loadingScreen').classList.add('hidden');
  }catch(e){
    document.querySelector('.loading-screen p').textContent='SQL 引擎載入失敗';
    document.querySelector('.load-sub').textContent=e.message;
    console.error(e);
  }
}

initApp();
</script>
</body>
</html>
