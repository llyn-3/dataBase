<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Learning Hub | SQL 學習資源站</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 480px;
      width: 90%;
    }
    h1 { color: #007acc; margin-bottom: 0.5rem; }
    p { color: #666; margin-bottom: 2rem; }
    .btn-container { display: flex; gap: 1rem; justify-content: center; }
    .btn {
      flex: 1;
      padding: 0.9rem;
      text-decoration: none;
      color: white;
      background-color: #007acc;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover { background-color: #005999; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SQL Resources Hub</h1>
    <p>Please select your preferred language<br>請選擇語言</p>
    <div class="btn-container">
      <a class="btn" href="./en/">English Version</a>
      <a class="btn" href="./zh/">中文版本</a>
    </div>
  </div>
</body>
</html>
